name: Build ESR base

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenClaw ESR version, e.g. 2026.6.33'
        required: true
        type: string

jobs:
  build-base:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase owner (GHCR requires lowercase)
        id: lc
        run: echo "owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      - name: Build & push base (${{ inputs.version }}, amd64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.base
          platforms: linux/amd64
          push: true
          build-args: |
            OPENCLAW_GIT_REF=v${{ inputs.version }}
          tags: |
            ghcr.io/${{ steps.lc.outputs.owner }}/openclaw-base:${{ inputs.version }}
          cache-from: type=gha,scope=base-amd64
          cache-to: type=gha,mode=max,scope=base-amd64